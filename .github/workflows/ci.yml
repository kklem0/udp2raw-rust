name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.85.1
          targets: aarch64-unknown-linux-gnu, aarch64-unknown-linux-musl
      - name: release provenance and publication regression
        run: tools/release/build_arm64_static_test.sh
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - name: cross type-check for the Raspberry Pi target
        run: cargo check --locked --target aarch64-unknown-linux-gnu --all-targets
      - name: compile-check the static ARM64 release target
        run: cargo check --locked --target aarch64-unknown-linux-musl --all-targets
