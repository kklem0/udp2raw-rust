name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - name: cross type-check for the Raspberry Pi target
        run: rustup target add aarch64-unknown-linux-gnu && cargo check --target aarch64-unknown-linux-gnu --all-targets
