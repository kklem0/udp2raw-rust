[package]
name = "udp2raw"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Wire-compatible Rust port of udp2raw: tunnel UDP over encrypted FakeTCP/UDP/ICMP raw sockets, with a multithreaded crypto pipeline"
license = "MIT"
repository = "https://github.com/kklem0/udp2raw-rust"

[[bin]]
name = "udp2raw"
path = "src/main.rs"

[lib]
name = "udp2raw"
path = "src/lib.rs"

[dependencies]
libc = "0.2"
mio = { version = "1", features = ["os-poll", "os-ext", "net"] }
clap = { version = "4", features = ["derive"] }
log = "0.4"
aes = "0.9"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
crc32fast = "1"
cpufeatures = "0.2"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-debug]
inherits = "release"
strip = false
debug = 1
