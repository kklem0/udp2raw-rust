# Nothing is pinned here on purpose: a native build on the Pi must not be forced to a
# cross-compiler name. When cross-compiling from another machine, point cargo at the
# cross linker through the environment instead, e.g.
#
#   sudo apt-get install g++-aarch64-linux-gnu
#   rustup target add aarch64-unknown-linux-gnu
#   CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
#       cargo build --release --target aarch64-unknown-linux-gnu
#
# or use https://github.com/cross-rs/cross:  cross build --release --target aarch64-unknown-linux-musl
